<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Pokéball Animations</title>
    <link rel="stylesheet" href="poke-test.css">
</head>
<body>
  <main id="app">
    <h1>Red Pokéball Animations</h1>

    <h2 class="section-title">Throw & Capture</h2>
    <div class="card" style="padding: 30px; margin-bottom: 20px;">
      <div class="poke ball throw">
        <span class="x">
          <span class="y">
            <span class="sprite"></span>
          </span>
        </span>
      </div>
      <label style="margin-top: 20px;">Throw Animation</label>
    </div>

    <h2 class="section-title">Ball States</h2>
    <div class="grid">
      <div class="card">
        <div class="poke ball"></div>
        <label>Idle</label>
      </div>

      <div class="card">
        <div class="poke ball side"></div>
        <label>Side</label>
      </div>

      <div class="card">
        <div class="poke ball open"></div>
        <label>Open</label>
      </div>

      <div class="card">
        <div class="poke ball roll"></div>
        <label>Roll</label>
      </div>

      <div class="card">
        <div class="poke ball rock"></div>
        <label>Rock</label>
      </div>

      <div class="card">
        <div class="poke ball bounce"></div>
        <label>Bounce</label>
      </div>
    </div>
  </main>
</body>
</html>
