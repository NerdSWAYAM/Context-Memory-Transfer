<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poké Context Ball</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body class="capture-mode">
    <div class="popup-container">
        <!-- Invisible tab hitzones positioned over artwork's CAPTURE / TRANSFER text -->
        <button class="tab-hitzone tab-hitzone--capture active" id="tab-capture" aria-label="Capture tab">
            <img src="../../assests/CAPTURE txt.png" alt="Capture txt" />
        </button>
        <button class="tab-hitzone tab-hitzone--transfer" id="tab-transfer" aria-label="Transfer tab">
            <img src="../../assests/TRANSFER txt.png" alt="TRANSFER txt" />
        </button>

        <div class="logo" id="logo">
            <img class="logo" id="logo" src="../../assests/POKe context ball LOGO.png" alt="Logo" />
        </div>

        <!-- ===== CAPTURE PANEL ===== -->
        <div id="capture-panel" class="panel panel--capture active">
            <!-- Pokéball — draggable via mouse events -->
            <div id="pokeball" class="pokeball-container" aria-hidden="true">
                <div style="transform: scale(4.4); transform-origin: center bottom;">
                    <div class="poke ball" id="pokeball-sprite"></div>
                </div>
            </div>

            <!-- Capture-complete flourish. Hidden until the summary backend finishes. -->
            <div id="capture-gotcha" class="capture-gotcha" aria-hidden="true">
                <span class="capture-gotcha__spark capture-gotcha__spark--1"></span>
                <span class="capture-gotcha__spark capture-gotcha__spark--2"></span>
                <span class="capture-gotcha__spark capture-gotcha__spark--3"></span>
                <span class="capture-gotcha__spark capture-gotcha__spark--4"></span>
                <span class="capture-gotcha__text">GOTCHA!</span>
            </div>

            <!-- Capture image-button (uses Capture.png asset) -->
            <button id="capture-btn" class="capture-img-btn" aria-label="Capture and Summarise">
                <img src="../../assests/Capture.png" alt="Capture" draggable="false" />
            </button>

            <!-- Status bar for capture / summarise progress -->
            <div id="capture-status" class="status-bar" style="display: none;"></div>
        </div>

        <!-- ===== TRANSFER PANEL ===== -->
        <div id="transfer-panel" class="panel panel--transfer">
            <!-- Refresh Button -->
            <!-- <button id="refresh-transfer-btn" class="refresh-btn" aria-label="Refresh list">↻</button> -->
            <!-- Scrollable container for chat cards -->
            <div class="transfer-cards-container" id="transfer-cards-container">
                <p id="transfer-empty-msg" class="pixel-text--muted">No context collections yet.<br>Capture a
                    conversation using PokeBall.</p>
            </div>
        </div>

        <!-- Footer links (always visible) -->
        <div class="footer-links">
            <a href="#" class="donate-link" id="donate-link">
                <img src="../../assests/DONATE.png" alt="Donate" draggable="false" />
            </a>
            <a href="https://github.com/NerdSWAYAM/Context-Memory-Transfer" target="_blank" rel="noopener noreferrer" class="github-link" id="github-link" aria-label="GitHub Repository">
                <img src="../../assests/github.png" alt="GitHub" draggable="false" />
            </a>
        </div>

        <!-- Hidden data containers — used by JS logic, never rendered -->
        <ul id="message-list" style="display:none;"></ul>
        <div id="active-chat-title" style="display:none;"></div>
    </div>

    <script type="module" src="popup.ts"></script>
</body>

</html>
