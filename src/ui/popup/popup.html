<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poké Context Memory</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h6>Poké Context Ball</h6>
        <div id="active-chat-title" style="font-size: 11px; color: #555; margin-bottom: 8px; font-weight: normal; font-style: italic;">Loading active chat...</div>
        <div class="button-group">
            <button id="capture-btn">Capture</button>
            <button id="summarise-btn">Summarise</button>
            <button id="clear-btn">Clear History</button>
        </div>
    </div>
    
    <div id="capture-status" style="display: none; padding: 8px 10px; background: #e8f4fd; margin-bottom: 8px; border-radius: 4px; font-size: 12px; color: #1a5276;"></div>

    <div id="summary-container" style="display: none; padding: 10px; background: #f0f0f0; margin-bottom: 10px; border-radius: 4px; font-size: 13px;">
        <!-- ML Summary will appear here -->
    </div>
    
    <div class="message-container">
        <ul id="message-list">
            <!-- Messages will be injected here -->
        </ul>
    </div>

    <!-- Ensure type="module" is used for Vite -->
    <script type="module" src="popup.ts"></script>
</body>
</html>
