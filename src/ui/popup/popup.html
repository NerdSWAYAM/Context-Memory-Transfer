<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poké Context Ball</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body class="capture-mode">
    <div class="popup-container">
        <!-- Invisible tab hitzones positioned over artwork's CAPTURE / TRANSFER text -->
        <button class="tab-hitzone tab-hitzone--capture active" id="tab-capture" aria-label="Capture tab">
            <img src="../../assests/CAPTURE txt.png" alt="Capture txt" />
        </button>
        <button class="tab-hitzone tab-hitzone--transfer" id="tab-transfer" aria-label="Transfer tab">
            <img src="../../assests/TRANSFER txt.png" alt="TRANSFER txt" />
        </button>

        <div class="logo" id="logo">
            <img class="logo" id="logo" src="../../assests/POKe context ball LOGO.png" alt="Logo" />
        </div>

        <!-- ===== CAPTURE PANEL ===== -->
        <div id="capture-panel" class="panel panel--capture active">
            <!-- Pokéball — draggable via mouse events -->
            <img class="pokeball" id="pokeball" draggable="false" alt="Poké Ball" />

            <!-- Capture image-button (uses Capture.png asset) -->
            <button id="capture-btn" class="capture-img-btn" aria-label="Capture and Summarise">
                <img src="../../assests/Capture.png" alt="Capture" draggable="false" />
            </button>

            <!-- Status bar for capture / summarise progress -->
            <div id="capture-status" class="status-bar" style="display: none;"></div>
        </div>

        <!-- ===== TRANSFER PANEL ===== -->
        <div id="transfer-panel" class="panel panel--transfer">
            <!-- Scrollable container for chat cards -->
            <div class="transfer-cards-container" id="transfer-cards-container">
                <p id="transfer-empty-msg" class="pixel-text--muted">No context collections yet.<br>Capture a conversation using PokeBall.</p>
            </div>
        </div>

        <!-- Donate link (always visible) -->
        <a href="#" class="donate-link" id="donate-link">
            <img src="../../assests/DONATE.png" alt="Donate" draggable="false" />
        </a>

        <!-- Hidden data containers — used by JS logic, never rendered -->
        <ul id="message-list" style="display:none;"></ul>
        <div id="active-chat-title" style="display:none;"></div>
    </div>

    <script type="module" src="popup.ts"></script>
</body>
</html>
