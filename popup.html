<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Memory Transfer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="pokedex-top">
        <div class="lens-container">
            <div class="main-lens">
                <div class="lens-reflection"></div>
            </div>
        </div>
        <div class="status-lights">
            <div class="light red"></div>
            <div class="light yellow"></div>
            <div class="light green"></div>
        </div>
    </div>
    
    <div class="screen-wrapper">
        <div class="screen-header-lights">
            <div class="small-light"></div>
            <div class="small-light"></div>
        </div>
        <div class="pokedex-screen">
            <h1>MemLink</h1>
            <p>Ready to transfer context...</p>
        </div>
        <div class="screen-footer">
            <div class="large-light"></div>
            <div class="speaker-grill">
                <div class="grill-line"></div>
                <div class="grill-line"></div>
                <div class="grill-line"></div>
                <div class="grill-line"></div>
            </div>
        </div>
    </div>

    <div class="pokedex-controls">
        <div class="d-pad">
            <div class="d-pad-vertical"></div>
            <div class="d-pad-horizontal"></div>
        </div>
        <div class="action-buttons">
            <button id="transferbtn">Transfer</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
